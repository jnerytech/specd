# specd — configuração do próprio repositório

[project]
client = "jnerytech"
language = "pt-BR"

[verify]
# As seis camadas. `provenance` voltou na Fatia 3, com a condição de guarda que
# faltava: ele só exige bundle quando a configuração declara alguma fonte
# `required`. Este repositório não declara nenhuma, então a camada roda e não
# cobra nada — e volta a cobrar no dia em que uma fonte obrigatória aparecer.
levels = ["provenance", "schema", "coverage", "anchors", "evidence", "project"]
validation_command = ["npm", "run", "verify"]

[verify.anchors]
policy = "graduated"

[anchors]
default = "grep"

[memory]
enabled = true
change_limit_lines = 150
task_limit_lines = 200
