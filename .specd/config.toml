# specd — configuração do próprio repositório

[project]
client = "jnerytech"
language = "pt-BR"

[verify]
# Fatia 2 liga coverage e evidence. `provenance` continua fora: como REQ-VER-003
# está escrito, ele reprova qualquer change sem bundle de `explore`, o que inclui
# as changes escritas à mão. Espera a Fatia 3. Listar uma camada não implementada
# é erro de configuração, não um pulo silencioso.
levels = ["schema", "coverage", "anchors", "evidence", "project"]
validation_command = ["npm", "run", "verify"]

[verify.anchors]
policy = "graduated"

[anchors]
default = "grep"

[memory]
enabled = true
change_limit_lines = 150
task_limit_lines = 200
