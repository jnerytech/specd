# specd — configuração do próprio repositório

[project]
client = "jnerytech"
language = "pt-BR"

[verify]
# Fatia 1 implementa schema, anchors e project. coverage e evidence dependem de
# tasks, que chegam com `propose`; provenance depende do manifest do `explore`,
# que esta change ainda não produziu. Listar uma camada não implementada é erro
# de configuração, não um pulo silencioso.
levels = ["schema", "anchors", "project"]
validation_command = ["npm", "run", "verify"]

[verify.anchors]
policy = "graduated"

[anchors]
default = "grep"

[memory]
enabled = true
change_limit_lines = 150
task_limit_lines = 200
